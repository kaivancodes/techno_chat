{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-storage-key="tc_theme_admin">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechnoChat – Admin Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'login.css' %}">
  <link rel="stylesheet" href="{% static 'admin/admin_login.css' %}">
  <script>
    (function(){
      var storageKey = document.documentElement.dataset.themeStorageKey || 'tc_theme_admin';
      var savedTheme = localStorage.getItem(storageKey) || 'dark';
      if (savedTheme === 'system') {
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="{% static 'tc_logo.png' %}" alt="TechnoChat" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-title">Techno<span>Chat</span></div>
      <div class="brand-sub">Administrator access only</div>
      <span class="admin-badge">Admin Portal</span>
    </div>

    {% if error %}
    <div class="error-msg" id="error-banner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <form class="form" method="POST" action="{% url 'admin_login' %}" id="login-form">
      {% csrf_token %}

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@technostacks.com"
          autocomplete="email" required value="{{ request.POST.email|default:'' }}">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password"
            placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password">
            <svg id="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-shut" viewBox="0 0 24 24" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-signin" id="btn-signin">
        <span class="btn-text">Sign in</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="divider">secure admin login</div>
    <div class="card-footer">New admin? <a href="{% url 'admin_register' %}">Create account</a></div>
  </div>
  <script src="{% static 'login.js' %}"></script>
</body>
</html>
